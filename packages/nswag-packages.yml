source: https://github.com/RicoSuter/NSwag#nuget-packages
description: >-
  First-party distributions of the NSwag toolchain, verified live against each
  public registry on 2026-08-06. NSwag ships no hosted API of its own, so these
  packages are the product: a set of .NET libraries (specification model,
  document generation, code generation, ASP.NET/OWIN middleware), an MSBuild
  targets package, a .NET global tool, an npm wrapper for the CLI, and a
  Chocolatey package for the NSwagStudio Windows GUI. Every package below is
  authored by Rico Suter and published from the RicoSuter/NSwag repository under
  MIT. Version numbers are the latest stable at probe time; total download
  counts come from the NuGet search index on the same date. Third-party packages
  that carry an "NSwag." prefix but are published by other authors
  (NSwag.Examples, NSwag.AspNetCore.Themes, NSwag.SwaggerGeneration.AzureFunctionsV2,
  NSwag.CodeGeneration.ActionFramework) are deliberately excluded — they are
  community add-ons, not first-party.

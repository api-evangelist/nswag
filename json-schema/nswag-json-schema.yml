description: >-
  NSwag's primary machine-readable interface is not an API contract — it has no
  API — but the nswag.json / *.nswag configuration document that the CLI and
  NSwagStudio both execute. NSwag itself publishes NO JSON Schema for that
  document; the settings are documented only as prose and a sample JSON blob on
  the wiki. The schema captured here is the community-maintained one from
  SchemaStore, fetched verbatim on 2026-08-06. It is recorded for provenance and
  is deliberately NOT wired as an NSwag-published artifact pointer, because it is
  not NSwag's and it is out of date.

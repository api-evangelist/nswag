    stale_note: >-
      Uses the pre-v12 property names — swaggerGenerator, webApiToSwagger,
      swaggerToCSharpClient, swaggerToTypeScriptClient, swaggerToCSharpController.
      Current NSwag documents use documentGenerator / webApiToOpenApi /
      openApiToCSharpClient / openApiToTypeScriptClient. Validating a modern
      nswag.json against it will not describe the real surface.
    documents: https://github.com/RicoSuter/NSwag/wiki/NSwag-Configuration-Document
provider_gap: >-
  NSwag should publish a first-party, current JSON Schema for nswag.json from the
  NSwag.Commands settings model and reference it with $schema, so editors and
  agents can validate a configuration document against the version of NSwag that
  will execute it. Today the only schema in circulation is a stale third-party
  copy, and API Evangelist is not going to author a replacement on the project's
  behalf.

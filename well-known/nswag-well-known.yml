provider_gap: >-
  NSwag publishes no /.well-known/ discovery surface of any kind, and no
  SECURITY.md in the repository (github.com/RicoSuter/NSwag/security/policy
  returns "No security policy detected"). For a toolchain with 201M+ NuGet
  downloads on NSwag.Core alone, the absence of any documented
  vulnerability-reporting path is the most consequential gap in this profile.

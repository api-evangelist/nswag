description: >-
  Well-known discovery probe for NSwag. NSwag operates no API host, so the only
  candidate host is nswag.org, the domain the GitHub repository still declares as
  its homepage — and that host no longer answers (TLS times out; HTTP returns
  403 from a parked server). Every path below therefore missed, and no documents
  were captured. Recorded so the miss is auditable rather than silent: this is an
  honest zero, not an unrun probe. No `WellKnown` or `SecurityTxt` pointer is
  wired into apis.yml, because nothing was found.

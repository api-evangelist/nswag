aid: nswag
name: NSwag
description: >-
  NSwag is the Swagger/OpenAPI toolchain for .NET, ASP.NET Core and TypeScript,
  written in C# and maintained by Rico Suter under an MIT licence. It runs the
  contract in both directions: generating Swagger 2.0 and OpenAPI 3.0 documents
  from ASP.NET (Core) controllers, Web API assemblies and plain .NET types, and
  generating C# clients, ASP.NET Web API controllers and TypeScript clients back
  out of those documents. It combines what Swashbuckle and AutoRest do
  separately into a single toolchain, which is how it avoids the incompatibility
  seams between the two and gets better fidelity on inheritance, enums and
  reference handling via NJsonSchema. NSwag operates no hosted API of its own —
  it is consumed as NuGet packages, MSBuild targets, an npm-distributed CLI and
  NSwagStudio, a Windows GUI that authors and executes the same nswag.json
  configuration document the CLI runs.
